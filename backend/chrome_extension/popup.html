<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BIBI Cars Parser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }
    
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #333;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    
    .version {
      font-size: 12px;
      color: #888;
    }
    
    .content {
      padding: 16px;
    }
    
    .source-card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #333;
    }
    
    .source-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .source-name {
      font-size: 16px;
      font-weight: 600;
    }
    
    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-active {
      background: #22c55e20;
      color: #22c55e;
    }
    
    .status-inactive {
      background: #ef444420;
      color: #ef4444;
    }
    
    .status-pending {
      background: #f59e0b20;
      color: #f59e0b;
    }
    
    .source-info {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #fff;
      color: #000;
    }
    
    .btn-primary:hover {
      background: #e5e5e5;
    }
    
    .btn-secondary {
      background: #333;
      color: #fff;
      margin-top: 8px;
    }
    
    .btn-secondary:hover {
      background: #444;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .current-page {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #333;
    }
    
    .current-page-title {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    
    .current-page-url {
      font-size: 13px;
      word-break: break-all;
      color: #60a5fa;
    }
    
    .footer {
      padding: 12px 16px;
      text-align: center;
      font-size: 11px;
      color: #666;
      border-top: 1px solid #222;
    }
    
    .footer a {
      color: #60a5fa;
      text-decoration: none;
    }
    
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    
    .message-success {
      background: #22c55e20;
      color: #22c55e;
      border: 1px solid #22c55e40;
    }
    
    .message-error {
      background: #ef444420;
      color: #ef4444;
      border: 1px solid #ef444440;
    }
    
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ffffff30;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">BIBI Cars</div>
    <div class="version">Parser Extension v3.0 — Copart + bid.cars</div>
  </div>
  
  <div class="content">
    <div id="message" class="message hidden"></div>
    
    <div id="currentPage" class="current-page hidden">
      <div class="current-page-title">Поточна сторінка:</div>
      <div id="currentUrl" class="current-page-url"></div>
    </div>
    
    <!-- Copart -->
    <div class="source-card">
      <div class="source-header">
        <span class="source-name">Copart</span>
        <span id="copart-status" class="status-badge status-pending">Перевірка...</span>
      </div>
      <div class="source-info" id="copart-info">Завантаження...</div>
      <button class="btn btn-primary" id="copart-sync">
        Синхронізувати Session
      </button>
    </div>
    
    <!-- Server URL -->
    <div class="source-card" style="border-color: #333;">
      <div style="font-size: 11px; color: #888; margin-bottom: 6px;">Сервер CRM:</div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="server-url" value="https://car-dealer-pro-7.preview.emergentagent.com" 
          style="flex:1; background:#111; border:1px solid #333; border-radius:8px; color:#fff; padding:8px 10px; font-size:12px; font-family:monospace;">
        <button class="btn btn-secondary" id="save-url" style="width:auto; margin:0; padding:8px 14px; font-size:12px;">
          Зберегти
        </button>
      </div>
    </div>
    
    <!-- bid.cars -->
    <div class="source-card">
      <div class="source-header">
        <span class="source-name">bid.cars</span>
        <span id="bidcars-status" class="status-badge status-pending">Перевірка...</span>
      </div>
      <div class="source-info" id="bidcars-info">Завантаження...</div>
      <button class="btn btn-primary" id="bidcars-sync">
        Синхронізувати Cookies
      </button>
      <button class="btn btn-secondary" id="bidcars-parse">
        Парсити поточну сторінку
      </button>
    </div>
    
    <!-- carfast (disabled for now) -->
    <div class="source-card" style="opacity: 0.5;">
      <div class="source-header">
        <span class="source-name">carfast.express</span>
        <span class="status-badge status-inactive">Скоро</span>
      </div>
      <div class="source-info">Підтримка буде додана пізніше</div>
      <button class="btn btn-primary" disabled>
        Синхронізувати Cookies
      </button>
    </div>
  </div>
  
  <div class="footer">
    <a href="https://car-dealer-pro-7.preview.emergentagent.com/admin" target="_blank">Відкрити CRM</a>
    &nbsp;•&nbsp;
    BIBI Cars © 2026
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
